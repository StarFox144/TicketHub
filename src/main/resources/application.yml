spring:
  application:
    name: tickethub
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/tickethub
    username: tickethub
    password: tickethub
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

tickethub:
  security:
    jwt:
      # base64, мінімум 256 біт; у проді — через змінну TICKETHUB_SECURITY_JWT_SECRET
      secret: ${TICKETHUB_SECURITY_JWT_SECRET:}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
