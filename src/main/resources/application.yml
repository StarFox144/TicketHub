spring:
  application:
    name: tickethub
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      # Redis — лише прискорювач: при збої краще швидко піти в БД, ніж чекати
      timeout: 500ms
      connect-timeout: 1s
  rabbitmq:
    host: localhost
    port: 5672
    # outbox-relay чекає підтвердження від брокера, перш ніж позначити подію надісланою
    publisher-confirm-type: simple
    listener:
      simple:
        # невдала обробка → ще 3 спроби з backoff → dead-letter queue (requeue вимкнено)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  mail:
    host: localhost
    port: 1025
  datasource:
    url: jdbc:postgresql://localhost:5432/tickethub
    username: tickethub
    password: tickethub
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

tickethub:
  security:
    jwt:
      # base64, мінімум 256 біт; у проді — через змінну TICKETHUB_SECURITY_JWT_SECRET
      secret: ${TICKETHUB_SECURITY_JWT_SECRET:}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
  booking:
    reservation-ttl: 10m
    max-seats-per-order: 10
    # pessimistic — SELECT ... FOR UPDATE; optimistic — @Version. Див. ReservationConcurrencyTest
    locking: pessimistic
    expiration-job:
      interval: 30s
      batch-size: 100
    # швидкий відсів зайнятих місць у Redis до транзакції в Postgres (вимикається для порівняння k6)
    redis-claims:
      enabled: true
  # усі @Scheduled-задачі (протухання резервів, outbox-relay); у тестах вимкнено
  scheduling:
    enabled: true
  outbox:
    relay-interval: 1s
    batch-size: 100
  messaging:
    exchange: tickets
  payment:
    # спільний секрет із платіжним провайдером для HMAC-підпису webhook; у проді — через змінну оточення
    webhook-secret: ${TICKETHUB_PAYMENT_WEBHOOK_SECRET:}
    # webhook зі старішою міткою часу відхиляється — захист від повторного відтворення перехопленого запиту
    webhook-tolerance: 5m
  tickets:
    storage-dir: ./data/tickets
    display-zone: Europe/Kyiv
    mail-from: TicketHub <tickets@tickethub.local>
  cache:
    # карта місць GET /events/{id}/seats; інвалідується при зміні статусів
    seat-map-ttl: 3s
  rate-limit:
    enabled: true
    login:
      capacity: 10
      period: 1m
    orders:
      capacity: 20
      period: 1m
