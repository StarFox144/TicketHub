spring:
  rabbitmq:
    listener:
      simple:
        retry:
          initial-interval: 100ms
          max-interval: 200ms

tickethub:
  security:
    jwt:
      secret: dfZiwv0WQekZbFyngwlsU1+ly1+hkpgDo6abRgLVVtkbBePhPqPzZs42IQtyFjpYEfQXglmy+pwJ++vPqJI01A==
  # job-и (протухання резервів, outbox-relay) тести викликають напряму
  scheduling:
    enabled: false
  payment:
    webhook-secret: test-webhook-secret
  tickets:
    storage-dir: build/test-tickets
  booking:
    redis-claims:
      enabled: true
  rate-limit:
    # тести логіняться десятки разів з 127.0.0.1; самі ліміти перевіряє RateLimitIT
    login:
      capacity: 100000
      period: 1m
    orders:
      capacity: 100000
      period: 1m
