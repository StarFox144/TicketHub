name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, ArchUnit, coverage gate
        run: ./gradlew build
      - name: Coverage summary
        if: always() && hashFiles('build/reports/jacoco/test/jacocoTestReport.csv') != ''
        run: |
          awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
            END {
              printf "### Покриття тестами\n\n| Рядки | Гілки |\n|---|---|\n| %.1f%% | %.1f%% |\n",
                100 * lc / (lm + lc), 100 * bc / (bm + bc)
            }' build/reports/jacoco/test/jacocoTestReport.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/jacoco/test/html
            build/reports/tests/test
          if-no-files-found: ignore
